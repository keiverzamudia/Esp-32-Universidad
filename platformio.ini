; TRACE-X: Evidence Reactor
; PlatformIO + ESP-IDF (framework espidf nativo)
; Objetivo: ESP32 clasico (generico). Ajustar board/flash cuando el
; hardware se identifique con esptool (ver docs/TRACE_X_HARDWARE_AUDIT.md).

[platformio]
default_envs = esp32dev
src_dir = src

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = espidf
board_build.partitions = partitions_trace_x.csv
monitor_speed = 115200
extra_scripts = scripts/embed_assets.py
build_flags =
    -D TRACE_X_FW_VERSION=\"1.0.0\"
    -D BOOT_BTN_GPIO=0
    -D STATUS_LED_GPIO=2
    -D STATUS_LED_ACTIVE_LOW=0
