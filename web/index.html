<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04070c">
<title>TRACE-X · Evidence Reactor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%232ee6ff' stroke-width='2' stroke-dasharray='4 3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%232ee6ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="fx-grid" aria-hidden="true"></div>
<div class="fx-scan" aria-hidden="true"></div>
<div class="fx-beam" aria-hidden="true"></div>

<header class="hud-top">
  <div class="brand"><span class="dot" aria-hidden="true"></span>TRACE-X <span class="sub">EVIDENCE&nbsp;REACTOR</span></div>
  <div class="conn" id="conn"><i></i><span id="connTxt">ENLAZANDO</span></div>
</header>

<main>
<section id="view-home" class="view">
  <div class="reactor" aria-hidden="true">
    <div class="r-ring r1"></div>
    <div class="r-ring r2"></div>
    <div class="r-ring r3"></div>
    <div class="r-core"></div>
  </div>
  <h1 class="glitch" data-txt="TRACE-X">TRACE-X</h1>
  <p class="tagline">«Un fallo no es el final. Es el comienzo de la investigación.»</p>

  <div class="panel-grid" id="homeStats"></div>

  <div class="panel">
    <h2 class="panel-t">ESCENARIOS DISPONIBLES</h2>
    <ul class="scen-list" id="homeScenarios"><li class="mut">Cargando manifiesto…</li></ul>
  </div>

  <div class="cta-row">
    <button class="btn primary" id="btnStart">INICIAR EXPERIENCIA ▸</button>
    <button class="btn" id="btnGallery">GALERÍA DE EVIDENCIAS</button>
  </div>
  <p class="hint" id="homeHint">El botón físico BOOT del dispositivo también controla la secuencia.</p>
</section>

<section id="view-present" class="view" hidden>
  <div class="phasebar" id="phasebar" aria-hidden="true"></div>
  <div id="presentBody"></div>
  <div class="cta-row">
    <button class="btn primary" id="btnNext">SIGUIENTE ▸</button>
    <button class="btn ghost" id="btnReset">REINICIAR</button>
    <button class="btn ghost" id="btnHome" title="Inicio">⌂</button>
  </div>
</section>

<section id="view-gallery" class="view" hidden>
  <div class="gal-head">
    <button class="btn ghost" id="btnBack">◂</button>
    <h2 class="panel-t">CENTRO DE EVIDENCIAS</h2>
  </div>
  <p class="note" id="galNote"></p>
  <div class="gal-grid" id="galGrid"></div>
</section>
</main>

<div class="detail" id="detail" hidden>
  <div class="detail-sheet">
    <div class="detail-top">
      <button class="btn ghost" id="detailClose">◂ VOLVER</button>
      <span class="badge" id="detailBadge"></span>
    </div>
    <div id="detailBody"></div>
  </div>
</div>

<div class="flash" id="flash" aria-hidden="true"></div>
<footer class="hud-foot"><span id="footL">TRACE-X</span><span id="footR">192.168.4.1</span></footer>
<script src="/app.js"></script>
</body>
</html>
